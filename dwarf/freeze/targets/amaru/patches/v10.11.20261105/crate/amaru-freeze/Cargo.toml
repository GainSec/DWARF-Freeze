[package]
name = "amaru-freeze"
version = "0.1.0"
edition.workspace = true
description = "In-process agent that lets an external debugger hold, inspect, edit and release every step a node takes."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
amaru-freeze-macros.workspace = true
cbor4ii.workspace = true
hex.workspace = true
parking_lot.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
